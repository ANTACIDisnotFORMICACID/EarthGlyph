[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthglyph"
version = "0.1.0"
description = "Sketch-based retrieval of real geographic outlines (lakes, reservoirs, ponds)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EarthGlyph" }]

# Core runtime: enough for geometry processing, features, retrieval and tests.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Data acquisition / cleaning pipeline (heavier GIS + IO stack).
data = [
    "geopandas>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "overturemaps>=0.4",
    "matplotlib>=3.8",
]
# Shape-matching baseline that relies on OpenCV (Hu moments / matchShapes).
cv = [
    "opencv-python-headless>=4.9",
]
# Official ShapeComp neural-approximation port: read the authors' published Keras
# .h5 weights and run a numpy forward pass. h5py only; no TensorFlow, no retraining.
shapecomp = [
    "h5py>=3.10",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["earthglyph*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["earthglyph"]
