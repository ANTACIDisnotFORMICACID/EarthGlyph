# Lightweight gates for every push / PR to main. Mirrors the local checkpoint
# gates exactly: Python pytest + ruff + mypy (+ strict mypy on the five
# production scripts) and Web npm ci + vitest + tsc + vite build.
#
# Real-data and frozen-artifact tests self-skip: data/, the perceptual
# gallery and the ShapeComp caches are build products and are not in git
# (docs/DATA_PIPELINE.md); CI downloads no data. Tool versions are pinned to
# the locally verified ones (docs/ENVIRONMENT.md) so a green check means
# "same gates, clean environment".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (all extras; tools pinned to local versions)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,cv,shapecomp]" \
            "ruff==0.17.3" "mypy==2.4.1" "pytest==9.2.0"
      # Job logs are admin-gated on this account, so failures must be readable
      # without them: the first 10 failing test IDs are re-emitted as ::error
      # annotations (visible via the public check-runs API) and the full digest
      # goes to the step summary on the run page. Gate semantics unchanged.
      - name: pytest
        run: |
          pytest -q -o addopts="" 2>&1 | tee pytest_output.log || {
            {
              echo "## pytest failure digest"
              echo '```'
              grep -E "^(FAILED|ERROR)" pytest_output.log | head -50 || true
              echo "--- tail ---"
              tail -30 pytest_output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAILED|ERROR)" pytest_output.log | head -10 | awk '{print $2}' \
              | while read -r test_id; do
                  echo "::error title=pytest failure::$test_id"
                done
            exit 1
          }
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: mypy --strict (five production scripts)
        run: >-
          mypy --strict
          scripts/serve_sketch_search.py
          scripts/score_p06_judgements.py
          scripts/make_p06_judgement_sheets.py
          scripts/export_static_index.py
          scripts/make_golden_retrieval_vectors.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
